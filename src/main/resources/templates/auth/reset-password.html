<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth-layout}"
      th:lang="${currentLang}">
<head><title>Đặt lại mật khẩu - SmartRent</title></head>
<body>
<div layout:fragment="content" class="w-full max-w-[500px]">
    <div class="glass-card animate-scale-in p-7 sm:p-10">
        <div class="flex items-center gap-3 mb-5">
            <span class="w-12 h-12 rounded-2xl bg-[color:var(--accent-soft)] text-[color:var(--accent)] grid place-items-center">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </span>
            <div>
                <h1 class="text-[28px] font-bold tracking-tight">Đặt lại mật khẩu</h1>
                <p class="text-[13px] text-[color:var(--text-mute)]">Mã xác nhận có hiệu lực trong 10 phút.</p>
            </div>
        </div>

        <div th:if="${error}" class="mb-4 px-4 py-3 rounded-xl bg-[color:var(--err-soft)] text-[color:var(--err)] text-[13px]">
            <span th:text="${error}">Lỗi</span>
        </div>
        <div th:if="${info}" class="mb-4 px-4 py-3 rounded-xl bg-[color:var(--ok-soft)] text-[color:var(--ok)] text-[13px]">
            <span th:text="${info}">Thông báo</span>
        </div>

        <form th:unless="${verified}" class="space-y-4" method="post" th:action="@{/reset-password/verify}">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div>
                <label class="form-label">Email</label>
                <div class="input-glass search-focus-ring">
                    <i data-lucide="mail" class="w-4 h-4 text-[color:var(--text-mute)]"></i>
                    <input type="email" name="email" required maxlength="160"
                           th:value="${resetEmail}"
                           placeholder="ban@gmail.com" />
                </div>
            </div>
            <div>
                <label class="form-label">Mã xác nhận</label>
                <div class="input-glass search-focus-ring">
                    <i data-lucide="binary" class="w-4 h-4 text-[color:var(--text-mute)]"></i>
                    <input class="tnum tracking-[0.24em]" type="text" name="code" required
                           minlength="6" maxlength="6" inputmode="numeric" pattern="[0-9]{6}"
                           autocomplete="one-time-code"
                           placeholder="123456" />
                </div>
                <p class="form-help">Kiểm tra hộp thư đến hoặc spam nếu chưa thấy email.</p>
            </div>
            <button type="submit" class="btn btn-primary w-full">
                Xác nhận mã
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <form th:if="${verified}" class="space-y-4" method="post" th:action="@{/reset-password}">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="email" th:value="${resetEmail}" />
            <div class="rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-[13px] text-emerald-700">
                Mã xác nhận đúng. Nhập mật khẩu mới cho <b th:text="${resetEmail}">email</b>.
            </div>
            <div>
                <label class="form-label">Mật khẩu mới</label>
                <div class="input-glass search-focus-ring">
                    <i data-lucide="lock" class="w-4 h-4 text-[color:var(--text-mute)]"></i>
                    <input type="password" name="password" required minlength="8" maxlength="64"
                           autocomplete="new-password" />
                </div>
            </div>
            <div>
                <label class="form-label">Nhập lại mật khẩu mới</label>
                <div class="input-glass search-focus-ring">
                    <i data-lucide="lock-keyhole" class="w-4 h-4 text-[color:var(--text-mute)]"></i>
                    <input type="password" name="confirmPassword" required minlength="8" maxlength="64"
                           autocomplete="new-password" />
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-full">
                Đổi mật khẩu
                <i data-lucide="check" class="w-4 h-4"></i>
            </button>
        </form>

        <p class="mt-6 text-center text-[14px] text-[color:var(--text-mute)]">
            <a href="/forgot-password" class="text-[color:var(--accent)] font-medium hover:underline">Gửi lại mã</a>
            <span class="mx-2">·</span>
            <a href="/login" class="text-[color:var(--accent)] font-medium hover:underline">Đăng nhập</a>
        </p>
    </div>
</div>
</body>
</html>
