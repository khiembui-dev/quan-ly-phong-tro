<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth-layout}"
      th:lang="${currentLang}">
<head><title>Quên mật khẩu - SmartRent</title></head>
<body>
<div layout:fragment="content" class="w-full max-w-[480px]">
    <div class="glass-card animate-scale-in p-7 sm:p-10">
        <div class="w-12 h-12 rounded-2xl bg-[color:var(--accent-soft)] text-[color:var(--accent)] grid place-items-center mb-5">
            <i data-lucide="key-round" class="w-6 h-6"></i>
        </div>
        <h1 class="text-[28px] font-bold tracking-tight mb-1">Quên mật khẩu?</h1>
        <p class="text-[14px] text-[color:var(--text-mute)] mb-6">
            Nhập email đăng nhập. SmartRent sẽ gửi mã xác nhận 6 số để bạn đặt mật khẩu mới.
        </p>

        <div th:if="${error}" class="mb-4 px-4 py-3 rounded-xl bg-[color:var(--err-soft)] text-[color:var(--err)] text-[13px]">
            <span th:text="${error}">Lỗi</span>
        </div>
        <div th:if="${info}" class="mb-4 px-4 py-3 rounded-xl bg-[color:var(--ok-soft)] text-[color:var(--ok)] text-[13px]">
            <span th:text="${info}">Thông báo</span>
        </div>

        <form class="space-y-4" method="post" th:action="@{/forgot-password}">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div>
                <label class="form-label">Email</label>
                <div class="input-glass search-focus-ring">
                    <i data-lucide="mail" class="w-4 h-4 text-[color:var(--text-mute)]"></i>
                    <input type="email" name="email" required maxlength="160"
                           th:value="${resetEmail}"
                           placeholder="ban@gmail.com" />
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-full">
                Gửi mã xác nhận
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>
        <p class="mt-6 text-center text-[14px] text-[color:var(--text-mute)]">
            <a href="/login" class="text-[color:var(--accent)] font-medium hover:underline">Quay lại đăng nhập</a>
        </p>
    </div>
</div>
</body>
</html>
