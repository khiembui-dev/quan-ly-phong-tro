<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="navbar">
    <header class="customer-nav" x-data="{ accountOpen: false }" @keydown.escape.window="accountOpen=false">
        <div class="customer-nav-inner">
            <div th:replace="~{fragments/brand :: brand('/customer/dashboard')}"></div>

            <nav class="customer-desktop-nav">
                <a sec:authorize="isAuthenticated()" href="/customer/dashboard"><i data-lucide="layout-dashboard"></i> Trang chủ</a>
                <a href="/customer/booking"><i data-lucide="building-2"></i> Phòng trống</a>
                <a sec:authorize="isAuthenticated()" href="/customer/dashboard#rooms"><i data-lucide="bed-double"></i> Phòng của tôi</a>
                <a sec:authorize="isAuthenticated()" href="/customer/invoices"><i data-lucide="receipt-text"></i> Hóa đơn</a>
                <a sec:authorize="isAuthenticated()" href="/customer/profile"><i data-lucide="user-round"></i> Hồ sơ</a>
                <a sec:authorize="isAuthenticated()" href="/customer/notifications" class="customer-nav-link-badge">
                    <i data-lucide="ticket-check"></i>
                    <span>Hỗ trợ</span>
                    <span th:if="${customerSupportBadge != null and customerSupportBadge > 0}"
                          class="customer-inline-badge"
                          th:text="${customerSupportBadge > 99 ? '99+' : customerSupportBadge}">1</span>
                </a>
            </nav>

            <div class="customer-nav-actions">
                <div th:replace="~{fragments/language-switcher :: switcher}"></div>

                <div sec:authorize="!isAuthenticated()" class="customer-auth-actions">
                    <a href="/login" class="btn btn-ghost">Đăng nhập</a>
                    <a href="/register" class="btn btn-primary">Đăng ký</a>
                </div>

                <div sec:authorize="isAuthenticated()" class="customer-account-actions">
                    <a href="/customer/notifications" class="customer-nav-icon" aria-label="Hỗ trợ">
                            <i data-lucide="ticket-check"></i>
                            <span th:if="${customerSupportBadge != null and customerSupportBadge > 0}"
                                  class="customer-notification-count"
                                  th:text="${customerSupportBadge > 99 ? '99+' : customerSupportBadge}">1</span>
                    </a>

                    <div class="relative">
                        <button type="button" class="customer-avatar-button" @click="accountOpen=!accountOpen">
                            <span class="avatar avatar-sm" sec:authentication="principal.initial">U</span>
                            <span sec:authentication="principal.fullName">Khách thuê</span>
                            <i data-lucide="chevron-down"></i>
                        </button>
                        <div x-show="accountOpen" x-cloak @click.outside="accountOpen=false" class="customer-nav-dropdown customer-account-dropdown">
                            <div class="customer-account-summary">
                                <b sec:authentication="principal.fullName">Khách thuê</b>
                                <span sec:authentication="principal.email">email</span>
                            </div>
                            <a href="/customer/profile"><i data-lucide="user-round"></i> Hồ sơ cá nhân</a>
                            <a href="/customer/dashboard#rooms"><i data-lucide="home"></i> Phòng của tôi</a>
                            <a href="/customer/invoices"><i data-lucide="receipt"></i> Hóa đơn</a>
                            <a href="/customer/notifications"><i data-lucide="ticket-check"></i> Hỗ trợ</a>
                            <a sec:authorize="hasAnyRole('OWNER','ADMIN','STAFF')" href="/admin"><i data-lucide="shield"></i> Khu vực quản trị</a>
                            <form action="/logout" method="post">
                                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit"><i data-lucide="log-out"></i> Đăng xuất</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <nav sec:authorize="isAuthenticated()" class="customer-bottom-nav no-print">
        <a href="/customer/dashboard"><i data-lucide="house"></i><span>Trang chủ</span></a>
        <a href="/customer/dashboard#rooms"><i data-lucide="bed-double"></i><span>Phòng</span></a>
        <a href="/customer/invoices"><i data-lucide="receipt-text"></i><span>Hóa đơn</span></a>
        <a href="/customer/profile"><i data-lucide="user-round"></i><span>Hồ sơ</span></a>
        <a href="/customer/notifications" class="customer-bottom-link-badge">
            <i data-lucide="ticket-check"></i>
            <span>Hỗ trợ</span>
            <b th:if="${customerSupportBadge != null and customerSupportBadge > 0}"
               th:text="${customerSupportBadge > 99 ? '99+' : customerSupportBadge}">1</b>
        </a>
    </nav>
</th:block>
</body>
</html>
