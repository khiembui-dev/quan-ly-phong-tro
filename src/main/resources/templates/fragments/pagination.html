<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Shared pagination fragment.
  Required params:
  - currentPage: zero-based page index
  - totalPages
  - totalElements
  - pageSize
  - baseUrl: URL ending with '&' or '?' before page/size params
-->
<nav th:fragment="pager(currentPage, totalPages, totalElements, pageSize, baseUrl)"
     th:with="
        firstIdx = ${(currentPage * pageSize) + (totalElements > 0 ? 1 : 0)},
        lastIdx  = ${(currentPage + 1) * pageSize > totalElements ? totalElements : (currentPage + 1) * pageSize}
     "
     class="admin-pager">

    <div class="admin-pager-summary tnum">
        Hiển thị <span th:text="${firstIdx}">1</span>
        - <span th:text="${lastIdx}">10</span>
        / <span th:text="${totalElements}">0</span>
        kết quả
    </div>

    <div class="admin-pager-pages">
        <a th:if="${currentPage > 0}"
           th:href="${baseUrl + 'page=' + (currentPage - 1) + '&size=' + pageSize}"
           class="admin-pager-nav"
           aria-label="Trang trước">
            <i data-lucide="chevron-left"></i>
            <span>Trước</span>
        </a>
        <span th:unless="${currentPage > 0}" class="admin-pager-nav is-disabled">
            <i data-lucide="chevron-left"></i>
            <span>Trước</span>
        </span>

        <th:block th:if="${totalPages > 1}"
                  th:with="
            start = ${currentPage - 2 < 0 ? 0 : currentPage - 2},
            end   = ${currentPage + 2 >= totalPages ? totalPages - 1 : currentPage + 2}">
            <a th:if="${start > 0}"
               th:href="${baseUrl + 'page=0&size=' + pageSize}"
               class="admin-pager-number tnum">1</a>
            <span th:if="${start > 1}" class="admin-pager-ellipsis">...</span>

            <th:block th:each="i : ${#numbers.sequence(start, end)}">
                <a th:href="${baseUrl + 'page=' + i + '&size=' + pageSize}"
                   th:text="${i + 1}"
                   th:class="${i == currentPage ? 'admin-pager-number is-active tnum' : 'admin-pager-number tnum'}">1</a>
            </th:block>

            <span th:if="${end < totalPages - 2}" class="admin-pager-ellipsis">...</span>
            <a th:if="${end < totalPages - 1}"
               th:href="${baseUrl + 'page=' + (totalPages - 1) + '&size=' + pageSize}"
               th:text="${totalPages}"
               class="admin-pager-number tnum">10</a>
        </th:block>

        <a th:if="${currentPage < totalPages - 1}"
           th:href="${baseUrl + 'page=' + (currentPage + 1) + '&size=' + pageSize}"
           class="admin-pager-nav"
           aria-label="Trang sau">
            <span>Sau</span>
            <i data-lucide="chevron-right"></i>
        </a>
        <span th:unless="${currentPage < totalPages - 1}" class="admin-pager-nav is-disabled">
            <span>Sau</span>
            <i data-lucide="chevron-right"></i>
        </span>
    </div>

    <div class="admin-pager-size" aria-label="Số dòng mỗi trang">
        <span>Hiển thị</span>
        <a th:href="${baseUrl + 'page=0&size=10'}"
           th:class="${pageSize == 10 ? 'is-active' : ''}">10</a>
        <a th:href="${baseUrl + 'page=0&size=20'}"
           th:class="${pageSize == 20 ? 'is-active' : ''}">20</a>
        <a th:href="${baseUrl + 'page=0&size=50'}"
           th:class="${pageSize == 50 ? 'is-active' : ''}">50</a>
        <a th:href="${baseUrl + 'page=0&size=100'}"
           th:class="${pageSize == 100 ? 'is-active' : ''}">100</a>
    </div>

    <div class="admin-pager-page-count">
        Trang <span class="tnum" th:text="${currentPage + 1}">1</span>
        / <span class="tnum" th:text="${totalPages > 0 ? totalPages : 1}">1</span>
    </div>
</nav>

</body>
</html>
