<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="aiButton" class="customer-ai no-print">
    <button type="button" class="customer-ai-fab" data-customer-chat-open aria-label="Mở Trợ lý SmartRent">
        <i data-lucide="message-circle-more"></i>
    </button>

    <section class="customer-ai-panel" data-customer-chat-panel hidden aria-label="Trợ lý SmartRent">
        <header>
            <span><i data-lucide="sparkles"></i></span>
            <div><b>Trợ lý SmartRent</b><small>Hỗ trợ khách thuê</small></div>
            <button type="button" data-customer-chat-close aria-label="Đóng"><i data-lucide="x"></i></button>
        </header>
        <div class="customer-ai-messages" data-customer-chat-messages>
            <div class="is-assistant">Xin chào! Tôi có thể giúp bạn tìm nhanh hóa đơn, gửi yêu cầu sửa chữa hoặc liên hệ chủ trọ.</div>
        </div>
        <div class="customer-ai-suggestions">
            <button type="button" data-customer-chat-suggestion="Tôi muốn xem hóa đơn">Tôi muốn xem hóa đơn</button>
            <button type="button" data-customer-chat-suggestion="Tôi muốn báo sửa chữa">Tôi muốn báo sửa chữa</button>
            <button type="button" data-customer-chat-suggestion="Tôi muốn hỏi tiền điện nước">Tôi muốn hỏi tiền điện nước</button>
            <button type="button" data-customer-chat-suggestion="Tôi muốn liên hệ chủ trọ">Tôi muốn liên hệ chủ trọ</button>
        </div>
        <form class="customer-ai-form" data-customer-chat-form>
            <input type="text" data-customer-chat-input placeholder="Nhập câu hỏi..." autocomplete="off" />
            <button type="submit" aria-label="Gửi"><i data-lucide="send"></i></button>
        </form>
    </section>
</div>
</body>
</html>
